<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Books for {{ query }} — Margin</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main><a href="{{ url_for('index') }}">← Back to discovery</a><h1>Books for “{{ query }}”</h1>{% if error %}<p role="alert">{{ error }}</p>{% else %}<div class="book-grid">{% for book in books %}<article><h2>{{ book.title }}</h2><p>{{ book.authors }}</p><a href="{{ book.url }}">View on Open Library</a></article>{% else %}<p>No matches. Try a different title or author.</p>{% endfor %}</div>{% endif %}</main></body></html>
